name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.0
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.4
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm run check:generated
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: go test -race ./...
        working-directory: cli
      - run: go vet ./...
        working-directory: cli
      - name: Check Go vulnerability reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
        working-directory: cli
      - name: Cross-build the four CLI targets
        run: sh scripts/release-cli.sh 0.1.0 dist/cli-ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # picomatch has no patched release for GHSA-fc5q-39xc-vjpf.
      # Keep build-tool findings visible while production dependencies remain gated.
      # Restore the full audit gate when a patched dependency chain is available.
      - name: Audit all dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: PUBLIC_ORIGIN=https://qrtoss.example docker compose config --quiet
      - name: Build production image
        run: docker build --tag qrtoss:ci .
