name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.0
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.4
          cache-dependency-path: cli/go.sum
      - name: Check Go formatting
        run: |
          gofmt_files=$(gofmt -l .)
          if [ -n "$gofmt_files" ]; then
            printf 'Go files require gofmt:\n%s\n' "$gofmt_files"
            exit 1
          fi
        working-directory: cli
      - name: Lint Go
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
        working-directory: cli
      - run: npm ci
      - run: npm run check:generated
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:cloudflare
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build
      - run: npm run test:cloudflare
      - name: Package Cloudflare Worker without deployment
        run: npx wrangler deploy --dry-run --outdir dist/cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: go test -race ./...
        working-directory: cli
      - run: go vet ./...
        working-directory: cli
      - name: Check Go vulnerability reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
        working-directory: cli
      - name: Cross-build the four CLI targets
        run: sh scripts/release-cli.sh dist/cli-ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # picomatch has no patched release for GHSA-fc5q-39xc-vjpf.
      # Keep build-tool findings visible while production dependencies remain gated.
      # Restore the full audit gate when a patched dependency chain is available.
      - name: Audit all dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Preserve browser failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: PUBLIC_ORIGIN=https://qrtoss.example docker compose config --quiet
      - name: Build production image
        run: docker build --tag qrtoss:ci .

  deploy:
    name: Deploy to Cloudflare
    needs: [test, e2e, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci
      - name: Deploy Worker and assets
        run: |
          : "${PUBLIC_ORIGIN:?Set the production PUBLIC_ORIGIN variable}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the production CLOUDFLARE_ACCOUNT_ID variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the production CLOUDFLARE_API_TOKEN secret}"
          npm run deploy:cloudflare
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
